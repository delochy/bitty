<!doctype html>
<!-- AI Side Quest — 타자 연습 (12차). 문장을 따라 치고 Enter. 타수는 자모 기준 근사치(NFD 길이). -->
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>AI Side Quest — 타자 연습</title>
<link rel="stylesheet" href="/games/common.css" />
<script src="/games/i18n.js"></script>
<style>
  .target { font-size: 16px; font-weight: 700; line-height: 1.5; min-height: 48px; word-break: keep-all; }
  .target .ok { color: var(--ok); }
  .target .bad { color: var(--bad); text-decoration: underline; }
  input {
    width: 100%; font-size: 15px; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); font-family: inherit; -webkit-user-select: text; user-select: text;
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .result { font-size: 14px; font-weight: 700; min-height: 20px; }
</style>
</head>
<body>
<div class="card" data-tauri-drag-region>
  <div class="top" data-tauri-drag-region><a href="/quest" data-en="← Quests">← 퀘스트</a><span class="title" data-tauri-drag-region data-en="⌨️ Typing">⌨️ 타자 연습</span><a href="/__close" title="닫기" data-en-title="Close">✕</a></div>
  <div class="stage">
    <div class="target" id="target"></div>
    <input id="input" placeholder="따라 치고 Enter" data-en-placeholder="Type it, then Enter" autocomplete="off" spellcheck="false" />
    <div class="result" id="result"></div>
    <div class="small" id="best"></div>
  </div>
</div>
<script>
  const SENTENCES_EN = [
    'The quick brown fox jumps over the lazy dog',
    'Small commits prevent big outages',
    'Never deploy on a Friday afternoon',
    'It works on my machine',
    'Code is read more often than it is written',
    'A journey of a thousand miles begins with a single step',
    'Rest is part of the work',
    'While the AI codes, I practice typing',
    'Tests passed, time for a coffee',
    'Every bug is a lesson in disguise',
    'Slow is smooth and smooth is fast',
    'Naming things is the hardest problem',
    'Keep calm and clear the cache',
    'The best error message is the one that never shows up',
    'If you want to go far, go together',
    'Back to the main quest after loading',
    'Premature optimization is the root of much pain',
    'Make it work, make it right, make it fast',
  ];
  const SENTENCES_KO = [
    '천 리 길도 한 걸음부터',
    '가는 말이 고와야 오는 말이 곱다',
    '버그는 잡으라고 있는 것이다',
    '오늘 할 일을 내일로 미루지 말자',
    '커밋은 작게 그리고 자주 하자',
    '금요일에는 배포하지 않는다',
    '티끌 모아 태산',
    '낮말은 새가 듣고 밤말은 쥐가 듣는다',
    '원숭이도 나무에서 떨어질 때가 있다',
    '급할수록 돌아가라',
    '백지장도 맞들면 낫다',
    '하늘이 무너져도 솟아날 구멍이 있다',
    'AI가 일하는 동안 나는 타자 연습을 한다',
    '시작이 반이다',
    '고생 끝에 낙이 온다',
    '작은 커밋이 큰 장애를 막는다',
    '잘 쉬는 것도 실력이다',
    '코드는 사람이 읽으라고 쓰는 것이다',
    '테스트가 통과하면 커피 한 잔',
    '빨리 가려면 혼자 가고 멀리 가려면 함께 가라',
    '로딩이 끝나면 메인 퀘스트로 돌아가자',
    '세 살 버릇 여든까지 간다',
    '말 한마디로 천 냥 빚을 갚는다',
    '구슬이 서 말이라도 꿰어야 보배',
  ];
  const SENTENCES = L === 'en' ? SENTENCES_EN : SENTENCES_KO;
  // 영어는 WPM(분당 단어, 5글자 = 1단어), 한국어는 타수(자모 기준 근사치)
  const KEY = 'side-quest-typing-best' + (L === 'en' ? '-en' : '');
  const target = document.getElementById('target');
  const input = document.getElementById('input');
  const result = document.getElementById('result');
  let sentence = '', startAt = 0, last = -1;
  function best() { try { return Number(localStorage.getItem(KEY)) || 0; } catch (e) { return 0; } }
  function showBest() { const b = best(); document.getElementById('best').textContent = b ? T('내 최고 ' + b + '타', 'My best ' + b + ' WPM') : ''; }
  function next() {
    let i;
    do { i = Math.floor(Math.random() * SENTENCES.length); } while (i === last);
    last = i;
    sentence = SENTENCES[i];
    target.textContent = sentence;
    input.value = '';
    startAt = 0;
    input.focus();
  }
  input.addEventListener('input', () => { if (!startAt) startAt = performance.now(); });
  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.isComposing) return;
    e.preventDefault();
    const typed = input.value;
    if (!typed) return;
    const minutes = Math.max((performance.now() - startAt) / 60000, 1 / 600);
    const speed = L === 'en' ? Math.round(typed.length / 5 / minutes) : Math.round(typed.normalize('NFD').length / minutes);
    let right = 0;
    target.innerHTML = '';
    [...sentence].forEach((ch, k) => {
      const span = document.createElement('span');
      span.textContent = ch;
      const ok = typed[k] === ch;
      if (ok) right++;
      span.className = ok ? 'ok' : 'bad';
      target.appendChild(span);
    });
    const acc = Math.round((right / Math.max(sentence.length, typed.length)) * 100);
    const b = best();
    const record = acc >= 90 && speed > b;
    if (record) { try { localStorage.setItem(KEY, String(speed)); } catch (e) {} }
    result.textContent = (record ? '🏆 ' : '') + T(speed + '타 · 정확도 ' + acc + '%', speed + ' WPM · accuracy ' + acc + '%');
    showBest();
    setTimeout(next, 1400);
  });
  showBest();
  next();
</script>
<script src="/games/track.js"></script>
</body>
</html>
