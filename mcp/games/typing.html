<!doctype html>
<!-- AI Side Quest — 타자 연습 (12차). 문장을 따라 치고 Enter. 타수는 자모 기준 근사치(NFD 길이). -->
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>AI Side Quest — 타자 연습</title>
<link rel="stylesheet" href="/games/common.css" />
<script src="/games/i18n.js"></script>
<style>
  .target { font-size: 16px; font-weight: 700; line-height: 1.5; min-height: 48px; word-break: keep-all; }
  .target .ok { color: var(--ok); }
  .target .bad { color: var(--bad); text-decoration: underline; }
  input {
    width: 100%; font-size: 15px; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); font-family: inherit; -webkit-user-select: text; user-select: text;
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .result { font-size: 14px; font-weight: 700; min-height: 20px; }
  /* 17차: 타자 통계 */
  .stats { width: 100%; font-size: 11px; color: var(--muted); }
  .stats .nums { display: flex; justify-content: space-between; gap: 6px; }
  .stats .nums b { display: block; font-size: 13px; color: var(--ink); }
  .spark { display: flex; align-items: flex-end; gap: 3px; height: 34px; margin-top: 6px; }
  .spark i { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; opacity: 0.75; }
  .spark i:last-child { opacity: 1; }
</style>
</head>
<body>
<div class="card" data-tauri-drag-region>
  <div class="top" data-tauri-drag-region><a href="/quest" data-en="← Quests">← 퀘스트</a><span class="title" data-tauri-drag-region data-en="⌨️ Typing">⌨️ 타자 연습</span><a href="/__close" title="닫기" data-en-title="Close">✕</a></div>
  <div class="stage">
    <div class="target" id="target"></div>
    <input id="input" placeholder="따라 치고 Enter" data-en-placeholder="Type it, then Enter" autocomplete="off" spellcheck="false" />
    <div class="result" id="result"></div>
    <div class="stats" id="stats"></div>
  </div>
</div>
<script>
  // 17차: 문장은 typing.json / typing-en.json 에 있다 — 줄만 추가하면 늘어난다.
  //  한 번 친 문장은 전부 돌 때까지 다시 나오지 않는다 (유머·퀴즈와 같은 방식).
  let deck = null;
  const KEY = 'side-quest-typing-best' + (L === 'en' ? '-en' : '');
  const target = document.getElementById('target');
  const input = document.getElementById('input');
  const result = document.getElementById('result');
  let sentence = '', startAt = 0;
  function best() { try { return Number(localStorage.getItem(KEY)) || 0; } catch (e) { return 0; } }
  // 최근 기록 (최대 50개): { at, speed, acc }
  const LOG = 'side-quest-typing-log' + (L === 'en' ? '-en' : '');
  function readLog() {
    try { return JSON.parse(localStorage.getItem(LOG) || '[]'); } catch (e) { return []; }
  }
  function addLog(speed, acc) {
    const log = readLog();
    log.push({ at: Date.now(), speed, acc });
    try { localStorage.setItem(LOG, JSON.stringify(log.slice(-50))); } catch (e) {}
  }
  function showBest() {
    const log = readLog();
    const today = new Date().setHours(0, 0, 0, 0);
    const todays = log.filter((r) => r.at >= today);
    const unit = T('타', ' WPM');
    const avg = (xs) => (xs.length ? Math.round(xs.reduce((a, b) => a + b, 0) / xs.length) : 0);
    const el = document.getElementById('stats');
    if (!log.length) {
      el.innerHTML = '<div style="text-align:center">' + T('한 문장 치면 기록이 쌓여요', 'Type one line to start your stats') + '</div>';
      return;
    }
    const recent = log.slice(-12);
    const max = Math.max(...recent.map((r) => r.speed), 1);
    el.innerHTML =
      '<div class="nums">' +
      '<div>' + T('오늘', 'Today') + '<b>' + todays.length + T('문장', '') + '</b></div>' +
      '<div>' + T('평균', 'Avg') + '<b>' + avg(todays.length ? todays.map((r) => r.speed) : log.map((r) => r.speed)) + unit + '</b></div>' +
      '<div>' + T('정확도', 'Accuracy') + '<b>' + avg((todays.length ? todays : log).map((r) => r.acc)) + '%</b></div>' +
      '<div>' + T('최고', 'Best') + '<b>' + best() + unit + '</b></div>' +
      '</div>' +
      '<div class="spark">' + recent.map((r) => '<i style="height:' + Math.round((r.speed / max) * 100) + '%" title="' + r.speed + unit + ' · ' + r.acc + '%"></i>').join('') + '</div>';
  }
  function makeDeck(items, key) {
    let seen = [];
    try { seen = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) {}
    let left = items.map((_, i) => i).filter((i) => !seen.includes(i));
    if (!left.length) { seen = []; left = items.map((_, i) => i); }
    left.sort(() => Math.random() - 0.5);
    return {
      total: items.length,
      seenCount: () => seen.length,
      next() {
        if (!left.length) { seen = []; left = items.map((_, i) => i).sort(() => Math.random() - 0.5); }
        const i = left.shift();
        seen.push(i);
        try { localStorage.setItem(key, JSON.stringify(seen)); } catch (e) {}
        return items[i];
      },
    };
  }
  function next() {
    if (!deck) return;
    sentence = deck.next();
    target.textContent = sentence;
    input.value = '';
    // 17차: 첫 글자가 아니라 입력칸에 커서가 들어간 순간부터 잰다.
    startAt = document.activeElement === input ? performance.now() : 0;
    input.focus();
  }
  input.addEventListener('focus', () => { if (!startAt) startAt = performance.now(); });
  input.addEventListener('input', () => { if (!startAt) startAt = performance.now(); });
  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.isComposing) return;
    e.preventDefault();
    const typed = input.value;
    if (!typed) return;
    const minutes = Math.max((performance.now() - startAt) / 60000, 1 / 600);
    const speed = L === 'en' ? Math.round(typed.length / 5 / minutes) : Math.round(typed.normalize('NFD').length / minutes);
    let right = 0;
    target.innerHTML = '';
    [...sentence].forEach((ch, k) => {
      const span = document.createElement('span');
      span.textContent = ch;
      const ok = typed[k] === ch;
      if (ok) right++;
      span.className = ok ? 'ok' : 'bad';
      target.appendChild(span);
    });
    const acc = Math.round((right / Math.max(sentence.length, typed.length)) * 100);
    const b = best();
    const record = acc >= 90 && speed > b;
    if (record) { try { localStorage.setItem(KEY, String(speed)); } catch (e) {} }
    result.textContent = (record ? '🏆 ' : '') + T(speed + '타 · 정확도 ' + acc + '%', speed + ' WPM · accuracy ' + acc + '%');
    addLog(speed, acc);
    showBest();
    setTimeout(next, 1400);
  });
  showBest();
  fetch(L === 'en' ? '/games/typing-en.json' : '/games/typing.json')
    .then((r) => r.json())
    .then((items) => {
      deck = makeDeck(items, 'side-quest-typing-seen' + (L === 'en' ? '-en' : ''));
      next();
    })
    .catch(() => (target.textContent = T('문장을 못 불러왔어요 😢', "Couldn't load sentences 😢")));
</script>
<script src="/games/track.js"></script>
</body>
</html>
