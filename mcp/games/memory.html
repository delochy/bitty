<!doctype html>
<!-- AI Side Quest — 카드 짝 맞추기 (12차). 4x4, 8쌍. 적은 횟수로 다 맞추면 최고 기록. -->
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>AI Side Quest — 짝 맞추기</title>
<link rel="stylesheet" href="/games/common.css" />
<style>
  .bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); margin: 6px 2px; }
  .bar a { color: var(--muted); text-decoration: none; }
  .grid { display: grid; grid-template-columns: repeat(4, 58px); gap: 6px; justify-content: center; perspective: 600px; }
  .cardx { width: 58px; height: 58px; position: relative; cursor: pointer; transform-style: preserve-3d; transition: transform 0.35s; }
  .cardx.flip, .cardx.done { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    backface-visibility: hidden; font-size: 28px;
  }
  .back { background: linear-gradient(160deg, #7dd3fc, #6366f1); }
  .front { background: rgba(127,127,127,0.12); transform: rotateY(180deg); }
  .cardx.done .front { background: rgba(22,163,74,0.18); }
  .msg { text-align: center; font-size: 13px; font-weight: 700; margin-top: 10px; height: 18px; }
</style>
</head>
<body>
<div class="card">
  <div class="top"><a href="/quest">← 퀘스트</a><span class="title">🃏 짝 맞추기</span><a href="/__close" title="닫기">✕</a></div>
  <div class="bar"><span>시도 <b id="moves">0</b></span><span>최고 <b id="best">-</b></span><a href="#" id="new">새 게임</a></div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg"></div>
</div>
<script>
  const EMOJI = ['🐱', '🐶', '🦊', '🐼', '🐸', '🐧', '🦄', '🐙', '🍕', '🍩', '🚀', '🌈', '⚡', '🎧', '🍀', '🎲'];
  const KEY = 'side-quest-memory-best';
  const gridEl = document.getElementById('grid');
  let first = null, lock = false, moves = 0, matched = 0;
  function best() { try { return Number(localStorage.getItem(KEY)) || 0; } catch (e) { return 0; } }
  function newGame() {
    gridEl.innerHTML = '';
    first = null; lock = false; moves = 0; matched = 0;
    document.getElementById('moves').textContent = 0;
    document.getElementById('best').textContent = best() || '-';
    document.getElementById('msg').textContent = '';
    const picks = EMOJI.slice().sort(() => Math.random() - 0.5).slice(0, 8);
    const deck = picks.concat(picks).sort(() => Math.random() - 0.5);
    deck.forEach((em) => {
      const c = document.createElement('div');
      c.className = 'cardx';
      c.dataset.em = em;
      c.innerHTML = '<div class="face back"></div><div class="face front">' + em + '</div>';
      c.addEventListener('click', () => flip(c));
      gridEl.appendChild(c);
    });
  }
  function flip(c) {
    if (lock || c === first || c.classList.contains('done')) return;
    c.classList.add('flip');
    if (!first) { first = c; return; }
    moves++;
    document.getElementById('moves').textContent = moves;
    if (first.dataset.em === c.dataset.em) {
      first.classList.add('done'); c.classList.add('done');
      first = null;
      matched++;
      if (matched === 8) {
        const b = best();
        const record = !b || moves < b;
        if (record) { try { localStorage.setItem(KEY, String(moves)); } catch (e) {} }
        document.getElementById('best').textContent = record ? moves : b;
        document.getElementById('msg').textContent = (record ? '🏆 신기록! ' : '🎉 ') + moves + '번 만에 다 맞췄어요';
      }
    } else {
      lock = true;
      const a = first;
      first = null;
      setTimeout(() => { a.classList.remove('flip'); c.classList.remove('flip'); lock = false; }, 700);
    }
  }
  document.getElementById('new').addEventListener('click', (e) => { e.preventDefault(); newGame(); });
  newGame();
</script>
</body>
</html>
