name: 🐞 버그 제보 / Bug report
description: 뭔가 이상하게 동작해요 / Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 고마워요! 로그를 붙이실 땐 `data/` 파일을 그대로 올리지 말고, 필요한 줄만 골라 개인 정보를 지워 주세요.
        Thanks for the report! If you attach logs, don't upload `data/` files as-is — paste only the lines you need, with personal details removed.

  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요? / What happened?
      description: 어떻게 됐고, 원래는 어떻게 돼야 했는지 적어 주세요. / What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 다시 겪으려면 / Steps to reproduce
      placeholder: |
        1. Claude Code에서 긴 작업을 시킨다
        2. 30초 뒤 위젯이 …
    validations:
      required: false

  - type: dropdown
    id: tool
    attributes:
      label: 어떤 도구로 쓰셨나요? / Which tool?
      multiple: true
      options:
        - Claude Code (데스크톱 앱 / desktop app)
        - Claude Code (터미널 / terminal)
        - Codex (앱 / app)
        - Codex (터미널 / terminal)
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 위젯 설치 방식 / How was the widget installed?
      options:
        - 빌드된 앱 받음 (Rust 없음) / Downloaded prebuilt app (no Rust)
        - 직접 빌드 / Built from source
        - 모르겠어요 / Not sure
    validations:
      required: false

  - type: input
    id: versions
    attributes:
      label: 버전 / Versions
      description: macOS, Bitty 릴리스, Claude Code(`claude --version`) 또는 Codex 버전 / macOS, Bitty release, Claude Code or Codex version
      placeholder: macOS 26.1 · Bitty v1.1.1 · Claude Code 2.1.276
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 스크린샷·로그 / Screenshots or logs
      description: 위젯 화면이 이상하면 스크린샷이 가장 도움이 돼요. / Screenshots help most for UI problems.
    validations:
      required: false
